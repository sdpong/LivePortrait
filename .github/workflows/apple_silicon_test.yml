name: Apple Silicon MPS Test

on:
  push:
    branches: [feature/apple-silicon-mps-support]
  pull_request:
    branches: [main]

jobs:
  syntax-and-import:
    name: Syntax & Import Check (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyTorch (CPU)
        run: |
          pip install torch==2.4.0 torchvision==0.19.0 torchaudio==2.4.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: |
          pip install pyyaml rich tyro

      - name: Compile check all Python files
        run: |
          find src/ -name "*.py" -exec python -m py_compile {} \;
          python -m py_compile inference.py
          python -m py_compile inference_animals.py
          python -m py_compile check_apple_silicon.py
          python -m py_compile speed.py

      - name: Import check - device module
        run: |
          python -c "from src.utils.device import select_device, inference_ctx, grid_sample_3d_fallback, is_mps, is_cuda, empty_cache, synchronize; print('device.py imports OK')"

      - name: Import check - MSDeformAttn fallback
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src/utils/dependencies/XPose/models/UniPose/ops/functions')
          from ms_deform_attn_func import ms_deform_attn_core_pytorch, _MS_CUDA_EXT_AVAILABLE
          print(f'MSDeformAttn CUDA ext available: {_MS_CUDA_EXT_AVAILABLE}')
          print('PyTorch fallback import OK')
          "

      - name: Run device selection logic
        run: |
          python -c "
          from src.utils.device import select_device, inference_ctx
          # Force CPU mode (no GPU on CI)
          device = select_device(device_id=0, flag_force_cpu=True)
          assert device == 'cpu', f'Expected cpu, got {device}'
          ctx = inference_ctx(device, flag_use_half_precision=False)
          print(f'Selected device: {device}')
          print(f'Inference context: {ctx}')
          "

      - name: Test device utilities (empty_cache, synchronize)
        run: |
          python -c "
          from src.utils.device import empty_cache, synchronize
          # These should be no-ops on CPU (not crash)
          empty_cache('cpu')
          synchronize('cpu')
          print('empty_cache and synchronize on CPU: OK')
          "

      - name: Test grid_sample_3d_fallback
        run: |
          python -c "
          import torch
          from src.utils.device import grid_sample_3d_fallback
          inp = torch.randn(1, 1, 4, 4, 4)
          grid = torch.randn(1, 4, 4, 4, 3)
          out = grid_sample_3d_fallback(inp, grid, align_corners=False)
          assert out.shape == (1, 1, 4, 4, 4), f'Bad shape: {out.shape}'
          print(f'grid_sample_3d_fallback output shape: {out.shape}')
          "

      - name: Test ms_deform_attn_core_pytorch
        run: |
          python -c "
          import torch
          import sys
          sys.path.insert(0, 'src/utils/dependencies/XPose/models/UniPose/ops/functions')
          from ms_deform_attn_func import ms_deform_attn_core_pytorch, _MS_CUDA_EXT_AVAILABLE
          assert not _MS_CUDA_EXT_AVAILABLE, 'CUDA ext should not be available on CPU CI'
          # Minimal test: N=1, S=4, M=2, D=8, Lq=2, L=1, P=2
          N, S, M, D = 1, 4, 2, 8
          Lq, L, P = 2, 1, 2
          value = torch.randn(N, S, M, D)
          spatial_shapes = torch.tensor([[2, 2]])
          sampling_locations = torch.sigmoid(torch.randn(N, Lq, M, L, P, 2))
          attention_weights = torch.softmax(torch.randn(N, Lq, M, L * P), dim=-1).view(N, Lq, M, L, P)
          out = ms_deform_attn_core_pytorch(value, spatial_shapes, sampling_locations, attention_weights)
          assert out.shape == (N, Lq, M * D), f'Bad shape: {out.shape}'
          print(f'ms_deform_attn_core_pytorch output shape: {out.shape}')
          print('Pure PyTorch fallback works!')
          "

  macos-mps-test:
    name: MPS Logic Test (macOS M1)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyTorch (macOS arm64 with MPS)
        run: |
          pip install torch==2.4.0 torchvision==0.19.0 torchaudio==2.4.0

      - name: Install test dependencies
        run: |
          pip install pyyaml rich tyro onnxruntime

      - name: Verify MPS backend is built
        run: |
          python -c "
          import torch
          print(f'PyTorch version: {torch.__version__}')
          print(f'MPS available: {torch.backends.mps.is_available()}')
          print(f'MPS built: {torch.backends.mps.is_built()}')
          assert torch.backends.mps.is_built(), 'MPS should be built in macOS arm64 PyTorch'
          "

      - name: Test device selection with MPS
        run: |
          python -c "
          from src.utils.device import select_device, inference_ctx
          device = select_device(device_id=0, flag_force_cpu=False)
          print(f'Auto-selected device: {device}')
          assert device == 'mps', f'Expected mps, got {device}'
          ctx = inference_ctx(device, flag_use_half_precision=True)
          print(f'Inference context for MPS: {type(ctx).__name__}')
          "

      # NOTE: GitHub Actions macos-14 runners are virtualized machines
      # without direct GPU pass-through. Metal/MPS runtime operations
      # (Conv2d, grid_sample, etc.) frequently segfault even though
      # torch.backends.mps.is_available() returns True.
      # We therefore test our *logic* on CPU, which exercises all the
      # same code paths minus the actual MPS compute.
      # Full MPS integration must be validated on real Apple Silicon.

      - name: Test grid_sample_3d_fallback (CPU path, same logic as MPS)
        run: |
          python -c "
          import torch
          from src.utils.device import grid_sample_3d_fallback
          # On CPU this is a straight pass-through — verifies F.grid_sample works
          inp = torch.randn(1, 1, 4, 4, 4)
          grid = torch.randn(1, 4, 4, 4, 3)
          out = grid_sample_3d_fallback(inp, grid, align_corners=False)
          assert out.shape == (1, 1, 4, 4, 4), f'Bad shape: {out.shape}'
          print(f'grid_sample_3d_fallback (CPU): shape={out.shape} ✓')
          # Also test the MPS fallback path by simulating MPS tensors:
          # create on CPU, mark as if they came from MPS, verify the
          # .cpu().clone().float() transfer logic would produce correct results
          inp_cpu = torch.randn(1, 1, 4, 4, 4)
          grid_cpu = torch.randn(1, 4, 4, 4, 3)
          import torch.nn.functional as F
          # Simulate what MPS path does: copy to CPU, compute, copy back
          input_for_compute = inp_cpu.cpu().clone().float()
          grid_for_compute = grid_cpu.cpu().clone().float()
          result = F.grid_sample(input_for_compute, grid_for_compute, align_corners=False)
          assert result.shape == (1, 1, 4, 4, 4)
          print(f'MPS-style CPU fallback chain: shape={result.shape} ✓')
          print('grid_sample_3d_fallback: PASSED')
          "

      - name: Test ms_deform_attn_core_pytorch (CPU, same logic as MPS)
        run: |
          python -c "
          import torch
          import sys
          sys.path.insert(0, 'src/utils/dependencies/XPose/models/UniPose/ops/functions')
          from ms_deform_attn_func import ms_deform_attn_core_pytorch, _MS_CUDA_EXT_AVAILABLE
          print(f'CUDA ext available: {_MS_CUDA_EXT_AVAILABLE}')
          assert not _MS_CUDA_EXT_AVAILABLE, 'CUDA ext should not be available on macOS CI'
          N, S, M, D = 1, 4, 2, 8
          Lq, L, P = 2, 1, 2
          value = torch.randn(N, S, M, D)
          spatial_shapes = torch.tensor([[2, 2]])
          sampling_locations = torch.sigmoid(torch.randn(N, Lq, M, L, P, 2))
          attention_weights = torch.softmax(torch.randn(N, Lq, M, L * P), dim=-1).view(N, Lq, M, L, P)
          out = ms_deform_attn_core_pytorch(value, spatial_shapes, sampling_locations, attention_weights)
          assert out.shape == (N, Lq, M * D), f'Bad shape: {out.shape}'
          print(f'ms_deform_attn_core_pytorch: shape={out.shape} ✓')
          print('MSDeformAttn PyTorch fallback: PASSED')
          "

      # Soft MPS runtime check — segfaults are expected on virtualized
      # runners, so we allow failure and just report the outcome.
      - name: Soft MPS runtime check (allowed to fail)
        run: |
          python -c "
          import torch, os
          os.environ['PYTORCH_ENABLE_MPS_FALLBACK'] = '1'
          device = torch.device('mps')
          # Minimal MPS tensor operation
          x = torch.randn(2, 2).to(device)
          y = x + x
          print(f'Basic MPS tensor op: {y.device}, shape={y.shape}')
          from src.utils.device import grid_sample_3d_fallback
          inp = torch.randn(1, 1, 4, 4, 4).to(device)
          grid = torch.randn(1, 4, 4, 4, 3).to(device)
          out = grid_sample_3d_fallback(inp, grid, align_corners=False)
          print(f'grid_sample_3d_fallback on MPS: device={out.device}, shape={out.shape}')
          print('MPS runtime check: PASSED')
          " 2>&1 || echo "::warning::MPS runtime ops failed on this CI runner (expected on virtualized macOS). Full MPS validation requires real Apple Silicon hardware."
        continue-on-error: true

      - name: Run check_apple_silicon.py
        run: |
          python check_apple_silicon.py || true
